[build-system]
requires = ["scikit-build-core>=0.9", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "dracolix"
version = "0.1.0"
description = "DracoLIX - native C++ scientific computing core (Python binding outgoing-only)"
readme = "docs/README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]
license = {text = "MIT"}

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["bindings/python/dracolix"]

[tool.scikit-build.cmake.define]
PYBIND_FINDPYTHON = "ON"

[project.optional-dependencies]
dev = ["pytest", "numpy"]

# Placeholder until bindings/python/CMakeLists.txt is implemented
# Build core only for now: cmake --build build
